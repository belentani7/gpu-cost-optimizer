name: GPU estimator verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Packaging, CLI, and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q optimizer tests
      - name: Run regressions
        run: python -m pytest -q
      - name: Test installed command
        run: |
          gpuopt --help
          gpuopt list-gpus
          gpuopt profile examples/workflow.json --gpu a100
          gpuopt compare examples/workflow.json --gpus a100,h100
          gpuopt report examples/workflow.json --output /tmp/gpu-estimate.md
          test -s /tmp/gpu-estimate.md
